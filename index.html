<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GALAXY DEFENDER - Offline Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background: radial-gradient(circle, #1f2833 0%, #0b0c10 100%);
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #66fcf1;
            text-shadow: 0 0 8px rgba(102, 252, 241, 0.6);
            pointer-events: none;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            padding: 15px 20px;
            box-sizing: border-box;
        }

        .d-pad {
            display: flex;
            gap: 15px;
        }

        .btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid #45a29e;
            background: rgba(31, 40, 51, 0.8);
            color: #66fcf1;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .btn:active {
            background: #66fcf1;
            color: #0b0c10;
        }

        .btn-fire {
            background: rgba(255, 0, 85, 0.3);
            border-color: #ff0055;
            color: #ff0055;
            width: 75px;
            height: 75px;
        }

        .btn-fire:active {
            background: #ff0055;
            color: #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-overlay">
        <div>SCORE: <span id="score">0</span></div>
        <div>HP: <span id="hp">❤❤❤</span></div>
    </div>
    <canvas id="gameCanvas" width="380" height="520"></canvas>
</div>

<!-- On-Screen Controls for Mobile -->
<div class="mobile-controls">
    <div class="d-pad">
        <button class="btn" id="btn-left">◀</button>
        <button class="btn" id="btn-right">▶</button>
    </div>
    <button class="btn btn-fire" id="btn-shoot">⚡</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const hpElement = document.getElementById('hp');

    let score = 0;
    let lives = 3;
    let gameOver = false;

    // Player Object
    const player = {
        x: canvas.width / 2 - 15,
        y: canvas.height - 60,
        width: 32,
        height: 32,
        speed: 5,
        dx: 0
    };

    let bullets = [];
    let enemies = [];
    let stars = [];

    // Background Stars
    for (let i = 0; i < 40; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 2 + 0.5
        });
    }

    // Keyboard Controls
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space' && !gameOver) shootBullet();
        if (e.code === 'KeyR' && gameOver) resetGame();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // Mobile Touch Controls
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnShoot = document.getElementById('btn-shoot');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = -player.speed; });
    btnLeft.addEventListener('touchend', () => { player.dx = 0; });
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = player.speed; });
    btnRight.addEventListener('touchend', () => { player.dx = 0; });
    btnShoot.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameOver) resetGame();
        else shootBullet();
    });

    // Mouse fallback for buttons
    btnLeft.addEventListener('mousedown', () => { player.dx = -player.speed; });
    btnLeft.addEventListener('mouseup', () => { player.dx = 0; });
    btnRight.addEventListener('mousedown', () => { player.dx = player.speed; });
    btnRight.addEventListener('mouseup', () => { player.dx = 0; });
    btnShoot.addEventListener('click', () => {
        if (gameOver) resetGame();
        else shootBullet();
    });

    function shootBullet() {
        bullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y,
            width: 4,
            height: 10,
            speed: 7
        });
    }

    function spawnEnemy() {
        if (gameOver) return;
        const size = Math.random() * 20 + 20;
        enemies.push({
            x: Math.random() * (canvas.width - size),
            y: -size,
            width: size,
            height: size,
            speed: Math.random() * 2 + 1.5,
            color: ['#ff0055', '#ff9900', '#c800ff'][Math.floor(Math.random() * 3)]
        });
    }

    setInterval(spawnEnemy, 900);

    function update() {
        if (gameOver) return;

        // Move Player Keyboard
        if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
        
        // Touch Move
        player.x += player.dx;

        // Keep inside bounds
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // Move Stars
        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) star.y = 0;
        });

        // Bullets Logic
        bullets.forEach((bullet, bIndex) => {
            bullet.y -= bullet.speed;
            if (bullet.y < 0) bullets.splice(bIndex, 1);
        });

        // Enemy Logic & Collision
        enemies.forEach((enemy, eIndex) => {
            enemy.y += enemy.speed;

            // Check hit bottom
            if (enemy.y > canvas.height) {
                enemies.splice(eIndex, 1);
                lives--;
                updateHP();
            }

            // Bullet hits Enemy
            bullets.forEach((bullet, bIndex) => {
                if (
                    bullet.x < enemy.x + enemy.width &&
                    bullet.x + bullet.width > enemy.x &&
                    bullet.y < enemy.y + enemy.height &&
                    bullet.y + bullet.height > enemy.y
                ) {
                    enemies.splice(eIndex, 1);
                    bullets.splice(bIndex, 1);
                    score += 10;
                    scoreElement.innerText = score;
                }
            });

            // Player hits Enemy
            if (
                player.x < enemy.x + enemy.width &&
                player.x + player.width > enemy.x &&
                player.y < enemy.y + enemy.height &&
                player.y + player.height > enemy.y
            ) {
                enemies.splice(eIndex, 1);
                lives--;
                updateHP();
            }
        });
    }

    function updateHP() {
        let hpString = '';
        for (let i = 0; i < lives; i++) hpString += '❤';
        hpElement.innerText = hpString || 'DEAD';

        if (lives <= 0) {
            gameOver = true;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Stars
        ctx.fillStyle = '#ffffff';
        stars.forEach(star => {
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        if (!gameOver) {
            // Draw Player Spaceship
            ctx.fillStyle = '#66fcf1';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Cockpit Glow
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + player.width / 2 - 2, player.y + 10, 4, 8);

            // Draw Bullets
            ctx.fillStyle = '#ffe600';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
            });
        } else {
            // Game Over Screen
            ctx.fillStyle = '#ff0055';
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
            ctx.fillText('Press "R" or Tap ⚡ to Restart', canvas.width / 2, canvas.height / 2 + 45);
        }
    }

    function resetGame() {
        score = 0;
        lives = 3;
        bullets = [];
        enemies = [];
        player.x = canvas.width / 2 - 15;
        scoreElement.innerText = score;
        updateHP();
        gameOver = false;
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
