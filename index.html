<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Target Rush</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:#05070d;
    color:white;
    overflow:hidden;
    touch-action:manipulation;
}

.screen{
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
    background:
        radial-gradient(circle at center,#28304f 0%,#080a12 65%,#030407 100%);
}

h1{
    font-size:52px;
    letter-spacing:2px;
    color:#ffcc00;
    text-shadow:0 0 25px #ffb300;
}

.subtitle{
    margin-top:8px;
    color:#b9bfcd;
    letter-spacing:2px;
}

.start-btn,
.restart-btn,
.home-btn{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:12px;
    background:#ffcc00;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#game{
    display:none;
    position:relative;
    min-height:100vh;
    width:100%;
    padding:0;
}

.hud{
    position:absolute;
    top:15px;
    left:12px;
    right:12px;
    z-index:10;

    display:flex;
    justify-content:space-between;
    gap:8px;
}

.hud-box{
    background:#0009;
    border:1px solid #ffffff22;
    border-radius:10px;
    padding:9px 12px;
    font-size:14px;
}

#arena{
    position:absolute;
    top:75px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
}

.target{
    position:absolute;
    width:76px;
    height:76px;

    border-radius:50%;

    background:
        radial-gradient(circle,
        #fff 0 10%,
        #ff3434 11% 27%,
        #fff 28% 43%,
        #ff3434 44% 61%,
        #fff 62% 100%
        );

    border:3px solid white;

    box-shadow:
        0 0 12px #ff3333,
        0 0 30px #ff2222;

    cursor:pointer;

    transform:translate(-50%,-50%);

    animation:targetIn .15s ease-out;
}

@keyframes targetIn{
    from{
        transform:translate(-50%,-50%) scale(.4);
        opacity:.3;
    }
    to{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }
}

.target.hit{
    animation:hit .18s ease-out;
}

@keyframes hit{
    to{
        transform:translate(-50%,-50%) scale(1.6);
        opacity:0;
    }
}

.miss{
    position:absolute;
    width:34px;
    height:34px;
    border:2px solid #ff3344;
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:miss .3s ease-out forwards;
}

@keyframes miss{
    to{
        width:100px;
        height:100px;
        opacity:0;
    }
}

#message{
    position:absolute;
    bottom:25px;
    left:0;
    right:0;
    text-align:center;
    font-weight:bold;
    pointer-events:none;
}

.good{
    color:#2cff9a;
}

.bad{
    color:#ff4455;
}

#gameover{
    display:none;
}

.final-score{
    margin-top:20px;
    font-size:25px;
}

.best-score{
    margin-top:8px;
    color:#ffcc00;
    font-size:18px;
}

.info{
    margin-top:18px;
    color:#aeb5c5;
}
</style>
</head>

<body>

<!-- HOME -->

<section id="home" class="screen">

    <h1>Target Rush</h1>

    <div class="subtitle">
        AIM FAST • TAP FASTER
    </div>

    <button class="start-btn" onclick="startGame()">
        PLAY 🎯
    </button>

</section>


<!-- GAME -->

<section id="game">

    <div class="hud">

        <div class="hud-box">
            Score: <b id="score">0</b>
        </div>

        <div class="hud-box">
            Level: <b id="level">1</b>
        </div>

        <div class="hud-box">
            ❤️ <b id="lives">3</b>
        </div>

        <div class="hud-box">
            ⏱️ <b id="time">3.0</b>
        </div>

    </div>

    <div id="arena"></div>

    <div id="message"></div>

</section>


<!-- GAME OVER -->

<section id="gameover" class="screen">

    <h1>GAME OVER</h1>

    <div class="final-score">
        Score: <b id="finalScore">0</b>
    </div>

    <div class="best-score">
        Best Score: <b id="bestScore">0</b>
    </div>

    <div class="info">
        Can you beat your record?
    </div>

    <button class="restart-btn" onclick="startGame()">
        PLAY AGAIN
    </button>

    <button class="home-btn" onclick="goHome()">
        HOME
    </button>

</section>


<script>

let score = 0;
let level = 1;
let lives = 3;
let time = 3;

let timer = null;
let targetTimer = null;

let targetElement = null;

let best =
Number(localStorage.getItem("targetRushBest")) || 0;


const home =
document.getElementById("home");

const game =
document.getElementById("game");

const gameover =
document.getElementById("gameover");

const arena =
document.getElementById("arena");

const message =
document.getElementById("message");


function showScreen(screen){

    home.style.display = "none";
    game.style.display = "none";
    gameover.style.display = "none";

    screen.style.display = "flex";

}


function startGame(){

    clearInterval(timer);
    clearTimeout(targetTimer);

    score = 0;
    level = 1;
    lives = 3;

    updateHUD();

    showScreen(game);

    message.textContent = "";

    createTarget();

}


function updateHUD(){

    document.getElementById("score").textContent =
        score;

    document.getElementById("level").textContent =
        level;

    document.getElementById("lives").textContent =
        lives;

}


function createTarget(){

    clearInterval(timer);
    clearTimeout(targetTimer);

    if(targetElement){
        targetElement.remove();
        targetElement = null;
    }

    /*
        Target gets smaller
        as level increases.
    */

    const size =
        Math.max(
            38,
            76 - level * 2
        );


    targetElement =
    document.createElement("div");

    targetElement.className = "target";

    targetElement.style.width =
        size + "px";

    targetElement.style.height =
        size + "px";


    /*
        Keep target away from
        the HUD area.
    */

    const arenaWidth =
        arena.clientWidth;

    const arenaHeight =
        arena.clientHeight;


    const margin =
        size / 2 + 10;


    const x =
        margin +
        Math.random() *
        Math.max(
            1,
            arenaWidth - margin * 2
        );


    const y =
        margin +
        Math.random() *
        Math.max(
            1,
            arenaHeight - margin * 2
        );


    targetElement.style.left =
        x + "px";

    targetElement.style.top =
        y + "px";


    targetElement.addEventListener(
        "pointerdown",
        hitTarget
    );


    arena.appendChild(
        targetElement
    );


    /*
        Higher level =
        less time.
    */

    time =
        Math.max(
            0.65,
            3 - level * 0.09
        );


    document.getElementById(
        "time"
    ).textContent =
        time.toFixed(1);


    timer =
    setInterval(()=>{

        time -= 0.1;

        document.getElementById(
            "time"
        ).textContent =
            Math.max(
                0,
                time
            ).toFixed(1);


        if(time <= 0){

            clearInterval(timer);

            missedTarget();

        }

    },100);

}


function hitTarget(event){

    event.stopPropagation();

    clearInterval(timer);

    if(!targetElement) return;


    targetElement.classList.add("hit");


    score += 10 * level;


    /*
        Every 5 successful hits
        increases the level.
    */

    if(score > 0 &&
       score % 50 === 0){

        level++;

        showMessage(
            "LEVEL UP! 🔥",
            true
        );

    }else{

        showMessage(
            "+ " + (10 * level),
            true
        );

    }


    updateHUD();


    setTimeout(()=>{

        if(targetElement){
            targetElement.remove();
            targetElement = null;
        }

        createTarget();

    },150);

}


function missedTarget(){

    lives--;

    updateHUD();

    showMessage(
        "MISS! ❤️ -1",
        false
    );


    if(lives <= 0){

        setTimeout(
            endGame,
            300
        );

    }else{

        createTarget();

    }

}


function wrongTap(x,y){

    lives--;

    updateHUD();

    showMessage(
        "WRONG! ❤️ -1",
        false
    );


    const miss =
    document.createElement("div");

    miss.className="miss";

    miss.style.left =
        x + "px";

    miss.style.top =
        y + "px";

    arena.appendChild(miss);


    setTimeout(()=>{
        miss.remove();
    },350);


    if(lives <= 0){

        setTimeout(
            endGame,
            300
        );

    }

}


arena.addEventListener(
    "pointerdown",
    function(event){

        /*
            If target itself was clicked,
            hitTarget handles it.
        */

        if(
            event.target.classList.contains(
                "target"
            )
        ){
            return;
        }


        const rect =
        arena.getBoundingClientRect();


        const x =
        event.clientX - rect.left;

        const y =
        event.clientY - rect.top;


        wrongTap(x,y);

    }
);


function showMessage(text,good){

    message.textContent = text;

    message.className =
        good ? "good" : "bad";


    setTimeout(()=>{

        message.textContent="";
        message.className="";

    },500);

}


function endGame(){

    clearInterval(timer);
    clearTimeout(targetTimer);

    if(targetElement){
        targetElement.remove();
        targetElement=null;
    }


    if(score > best){

        best = score;

        localStorage.setItem(
            "targetRushBest",
            best
        );

    }


    document.getElementById(
        "finalScore"
    ).textContent = score;


    document.getElementById(
        "bestScore"
    ).textContent = best;


    showScreen(gameover);

}


function goHome(){

    clearInterval(timer);
    clearTimeout(targetTimer);

    if(targetElement){
        targetElement.remove();
        targetElement=null;
    }

    showScreen(home);

}

</script>

</body>
</html>
